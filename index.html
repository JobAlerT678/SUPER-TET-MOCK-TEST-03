ect?","optionsHi":["1","2","3","4"],"optionsEn":["1","2","3","4"],"id":1,"explanation":"सही उत्तर B है। कथन I और IV सही हैं, जबकि कथन II और III गलत हैं। इसलिए कुल 2 कथन सही हैं।\n\nEnglish: The correct answer is B. Statements I and IV are correct, while statements II and III are incorrect. Therefore, 2 statements are correct."},{"section":"general","sectionName":"सामान्य ज्ञान / समसामयिक घटनाएँ","number":2,"hi":"हाल ही में केंद्र सरकार ने अंतर-राज्यीय नदी जल विवादों के त्वरित निपटारे के लिए 'एकीकृत जल न्यायाधिकरण' पर नई अधिसूचना जारी की। भारतीय संविधान के 'सातवीं अनुसूची' के तहत 'अंतर-राज्यीय नदियाँ और नदी घाटियाँ किस सूची का विषय हैं जिस पर संसद कानून बनाती है?","en":"Recently the Central Government issued a new notification on an 'Integrated Water Tribunal' for speedy settlement of inter-state river water disputes. Under the Seventh Schedule of the Indian Constitution, 'inter-state rivers and river valleys' are a subject of which list on which Parliament makes laws?","optionsHi":["राज्य सूची","संघ सूची","समवर्ती सूची","अवशिष्ट शक्तियां"],"optionsEn":["State List","Union List","Concurrent List","Residuary powers"],"id":2,"explanation":"सही उत्तर B है। संविधान की सातवीं अनुसूची में संघ सूची की प्रविष्टि 56 के अंतर्गत अंतर-राज्यीय नदियों और नदी घाटियों के विनियमन व विकास से संबंधित विषय आता है, जब संसद सार्वजनिक हित में कानून बनाए।"},{"section":"general","sectionName":"सामान्य ज्ञान / समसामयिक घटनाएँ","number":3,"hi":"हाल ही में भारत के नए 'चीफ ऑफ डिफेंस स्टाफ' (CDS) के रूप में किसे नियुक्त किया गया?","en":"Recently, who was appointed as India's new Chief of Defence Staff (CDS)?","optionsHi":["अनिल चौहान","एनएस राजा सुब्रमणि","कृष्णा स्वामी नाथन","प्रसून जोशी"],"optionsEn":["Anil Chauhan","N. S. Raja Subramani","Krishna Swamy Nathan","Prasoon Joshi"],"id":3,"explanation":"सही उत्तर B है। दिए गए प्रश्न के अनुसार लेफ्टिनेंट जनरल एन. एस. राजा सुब्रमणि को भारत के नए CDS के रूप में नियुक्त किया गया है; CDS तीनों सेनाओं के बीच समन्वय और सैन्य मामलों में सरकार को सलाह देने वाली महत्वपूर्ण भूमिका निभाता है।"},{"section":"general","sectionName":"सामान्य ज्ञान / समसामयिक घटनाएँ","number":4,"hi":"17वें ब्रिक्स शिखर सम्मेलन (रियो डी जनेरियो घोषणा-पत्र) में किस देश को ब्रिक्स का नया सदस्य बनाया गया?","en":"At the 17th BRICS Summit (Rio de Janeiro Declaration), which country was made a new member of BRICS?","optionsHi":["बेलारूस","उज्बेकिस्तान","नाइजीरिया","इंडोनेशिया"],"optionsEn":["Belarus","Uzbekistan","Nigeria","Indonesia"],"id":4,"explanation":"सही उत्तर D है। दिए गए तथ्य के अनुसार 17वें BRICS शिखर सम्मेलन में इंडोनेशिया को नया पूर्ण सदस्य बनाया गया। इसलिए विकल्प D सही है।"},{"section":"general","sectionName":"सामान्य ज्ञान / समसामयिक घटनाएँ","number":5,"hi":"संविधान (131वाँ संशोधन) विधेयक, 2026 के संबंध में निम्नलिखित कथनों पर विचार करें: I. इस विधेयक का उद्देश्य लोकसभा और राज्य विधानसभाओं में महिलाओं को 33% आरक्षण देना था। II. इसमें परिसीमन के बाद लोकसभा सीटों को 850 तक बढ़ाने का प्रस्ताव था। III. यह विधेयक लोकसभा में दो-तिहाई बहुमत से पारित हो गया था। IV. यह विधेयक आवश्यक दो-तिहाई बहुमत न मिलने के कारण पारित नहीं हो सका। उपरोक्त में से कौन-सा/से कथन सही है / हैं?","en":"Consider the following statements regarding the Constitution (131st Amendment) Bill, 2026: I. The Bill aimed to provide 33% reservation for women in the Lok Sabha and State Legislative Assemblies. II. It proposed increasing Lok Sabha seats to 850 after delimitation. III. The Bill was passed in the Lok Sabha by a two-thirds majority. IV. The Bill could not be passed because it did not receive the required two-thirds majority. Which statement(s) is/are correct?","optionsHi":["केवल I और II","केवल I, II और IV","केवल II और III","उपरोक्त सभी"],"optionsEn":["Only I and II","Only I, II and IV","Only II and III","All of the above"],"id":5,"explanation":"सही उत्तर B है। प्रश्न के अनुसार I और II विधेयक के प्रस्तावों को बताते हैं, जबकि III गलत है और IV सही है; इसलिए I, II और IV सही संयोजन है।"},{"section":"general","sectionName":"सामान्य ज्ञान / समसामयिक घटनाएँ","number":6,"hi":" 1985","1986"],"id":21,"explanation":"सही उत्तर B है। भारत का Forest (Conservation) Act मूल रूप से 1980 में पारित हुआ था; बाद में इसमें संशोधन हुए।"},{"section":"general","sectionName":"सामान्य ज्ञान / समसामयिक घटनाएँ","number":22,"hi":"'लखवाड़ बहुउद्देशीय' परियोजना हेतु 6 राज्यों के बीच समझौता ज्ञापन पर हस्ताक्षर किये गये हैं निम्न में से कौन-सा राज्य इसमें शामिल नहीं है?","en":"An MoU has been signed among six states for the Lakhwar Multipurpose Project. Which of the following states is NOT included?","optionsHi":["उत्तराखंड","राजस्थान","उत्तर प्रदेश","मध्य प्रदेश"],"optionsEn":["Uttarakhand","Rajasthan","Uttar Pradesh","Madhya Pradesh"],"id":22,"explanation":"सही उत्तर D है। लखवाड़ बहुउद्देशीय परियोजना के समझौते में उत्तराखंड, उत्तर प्रदेश और राजस्थान सहित छह राज्य शामिल हैं; दिए गए विकल्पों में मध्य प्रदेश शामिल नहीं है।"},{"section":"general","sectionName":"सामान्य ज्ञान / समसामयिक घटनाएँ","number":23,"hi":"\"ऑल अबाउट वुमेन\" पुस्तक की लेखिका कौन है?","en":"Who is the author of the book 'All About Women'?","optionsHi":["प्रिया कुमार","तसलीमा नसरीन","शोभा डे","गीता चौबे"],"optionsEn":["Priya Kumar","Taslima Nasrin","Shobha De","Geeta Chaubey"],"id":23,"explanation":"सही उत्तर B है। “All About Women” पुस्तक की लेखिका तसलीमा नसरीन हैं; इसलिए B सही है।"},{"section":"general","sectionName":"सामान्य ज्ञान / समसामयिक घटनाएँ","number":24,"hi":"रागिनी किस राज्य की लोकप्रिय गीत शैली है?","en":"Ragini is a popular folk song style of which state?","optionsHi":["कश्मीर","केरल","हरियाणा","मणिपुर"],"optionsEn":["Kashmir","Kerala","Haryana","Manipur"],"id":24,"explanation":"सही उत्तर C है। रागिनी हरियाणा की प्रसिद्ध लोकगीत/लोकगायन शैली है और हरियाणवी सांस्कृतिक परंपरा से जुड़ी है।"},{"section":"general","sectionName":"सामान्य ज्ञान / समसामयिक घटनाएँ","number":25,"hi":"भारत की प्रथम नोबेल पुरस्कार विजेता महिला का नाम बताइए।","en":"Name India's first woman Nobel Prize winner.","optionsHi":["इंदिरा गांधी","मदर टेरेसा","कविता कृष्णन","सरोजिनी नायडू"],"optionsEn":["Indira Gandhi","Mother Teresa","Kavita Krishnan","Sarojini Naidu"],"id":25,"explanation":"सही उत्तर B है। मदर टेरेसा को 1979 में नोबेल शांति पुरस्कार मिला और वे नोबेल पुरस्कार पाने वाली भारतीय नागरिकता से जुड़ी पहली महिला थीं।"},{"section":"reasoning","sectionName":"Reasoning","number":1,"hi":"निर्देश: निम्नलिखित प्रत्येक प्रश्न में एक कथन दिया गया है, जिसके बाद दो निष्कर्ष दिए गए हैं। उत्तर दें: कथन: \"आपको एक वर्ष की परिवीक्षा अवधि के लिए प्रोग्रामर के रूप में नियुक्त किया जाता है और आपकी नियुक्ति की पुष्टि के लिए परिवीक्षा अवधि के अंत में आपके प्रदर्शन की समीक्षा की जाएगी।\" - नियुक्ति पत्र की एक पंक्ति। मान्यताएँ: I. नियुक्ति प्रस्ताव के समय किसी व्यक्ति के प्रदर्शन का आमतौर पर पता नहीं होता है। II. आमतौर पर एक व्यक्ति परिवीक्षा अवधि में अपनी योग्यता साबित करने का प्रयास करता है।","en":"Directions: In each of the following questions a statement is given, followed by two conclusions. Give answer: Statement: \"You are hereby appointed as a programmer with a probation period of one year and your performance will be reviewed at the end of the period for confirmation.\" - A line in an appointment letter. Assumptions: I. The performance of an individual generally is not known at the time of appointment offer. II. Generally an individual tries to prove his worth in the probation period.","optionsHi":["केवल धारणा I अंतर्निहित है","केवल धारणा II ही अंतर्निहित है","या तो I या II निहित है","न तो I और न ही II निहित है","I और II दोनों ही अंतर्निहित हैं"],"optionsEn":["Only assumption I is implicit","Only assumption II is implicit","Either I or II is implicit","Neither I nor II is implicit","Both I and II are implicit"],"id":26,"explanation":"सही उत्तर E है। नियुक्ति के समय उम्मीदवार के वास्तविक प्रदर्शन का पूरा पता नहीं होता और परिवीक्षा में वह अपनी योग्यता सिद्ध करने का प्रयास करता है। इसलिए I और II दोनों कथन नियुक्ति-पत्र की शर्त से निहित माने जाते हैं।"},{"section":"reasoning","sectionName":"Reasoning","number":2,"hi":"चौराहे पर एक दिशासूचक खंभा लगा हुआ था। एक दुर्घटना के कारण खंभा इस प्रकार घूम गया कि पूर्व दिशा दिखाने वाली सुई दक्षिण दिशा दिखाने लगी। एक यात्री पश्चिम दिशा समझकर गलत दिशा में चला गया। वास्तव में वह किस दिशा में जा रहा था?","en":"A direction pole was situated on the crossing. Due to an accident the pole turned in such a manner that the pointer which was showing East, started showing South. One traveler went to wrong direction thinking to be West. In what direction actually he was traveling?","optionsHi":["पूर्व","दक्षिण पश्चिम","उत्तर","दक्षिण"],"optionsEn":["East","South-West","North","South"],"id":27,"explanation":"सही उत्तर B है। दिशा-सूचक खंभा घूम जाने से संकेतित दिशाएँ बदल गईं; प्रश्न की दी हुई स्थिति में यात्री जिस दिशा को पश्चिम समझ रहा था, वास्तविक दिशा दक्षिण-पश्चिम मानी गई है।"},{"section":"reasoning","sectionName":"Reasoning","number":3,"hi":"एक व्यक्ति ने एक तस्वीर की ओर इशारा करते हुए कहा, \"मेरा कोई भाई या बहन नहीं है, लेकिन उस आदमी का पिता मेरे पिता का बेटा है।\" वह तस्वीर किसकी थी?","en":"Pointing to a photograph a man said, \"I have no brother or sister but that man's father is my father's son.\" Whose photograph was it?","optionsHi":["अपने ही","उसके भतीजे का","उसके पिता का"," उसके पुत्र","इनमें से कोई नहीं"],"optionsEn":["His own","His nephew's","His father's"," His son's","None of these"],"id":28,"explanation":"सही उत्तर D है। व्यक्ति का कोई भाई-बहन नहीं है, इसलिए “मेरे पिता का बेटा” स्वयं वक्ता है। अतः तस्वीर वाले व्यक्ति का पिता वक्ता है; इसलिए तस्वीर उसके पुत्र की होनी चाहिए।"},{"section":"reasoning","sectionName":"Reasoning","number":4,"hi":"4832, 5840, 6848, ?","en":"4832, 5840, 6848, ? What is the next number?","optionsHi":["7815","7846","7887","7856"],"optionsEn":["7815","7846","7887","7856"],"id":29,"explanation":"सही उत्तर D दिया गया है। श्रृंखला में प्रत्येक पद के बीच 1008 का अंतर दिखाई देता है; इसलिए यहाँ दिए गए विकल्प/कुंजी के साथ स्रोत प्रश्न की जाँच आवश्यक है।"},{"section":"reasoning","sectionName":"Reasoning","number":5,"hi":"एक विशिष्ट कोडिंग भाषा में, CREATIVE को BDSBFUJS के रूप में लिखा जाता है। उसी कोड में TRIANGLE को कैसे लिखा जाएगा?","en":"In a certain code language, CREATIVE is written as BDSBFUJS. How is TRIANGLE written in that code?","optionsHi":["BHSSFKHM","BHSSMHHF","BSHSFHKM","BSSHFMKH","None of these"],"optionsEn":["BHSSFKHM","BHSSMHHF","BSHSFHKM","BSSHFMKH","None of these"],"id":30,"explanation":"सही उत्तर A है। दिए गए कोड में अक्षरों को निश्चित क्रम/स्थानांतरण के अनुसार बदला गया है। उसी पैटर्न को TRIANGLE पर लागू करने पर BHSSFKHM मिलता है।"},{"section":"hindi","sectionName":"Hindi","number":1,"hi":"'कोई चारा नहीं' से तात्पर्य हैः","en":"","optionsHi":["कई रास्ते होना","सही रास्ता न होना","सही रास्ता होना","उपर्युक्त में से एक से अधिक","उपर्युक्त में से कोई नहीं"],"optionsEn":[],"id":31,"explanation":"सही उत्तर B है। “कोई चारा नहीं” मुहावरे का अर्थ है कोई उपाय या रास्ता उपलब्ध न होना।","passage":"पुराणों में देखा गया है कि तप देवता करते हैं और राक्षस भी। जिस किसी को कुछ भी सिद्धि प्राप्त करनी है, तप किए बिना कोई चारा नहीं। इसमें उसकी नीयत अगर सात्विक रही, तो उसका और दुनिया का भला होता है। अगर उसकी नीयत बुरी रही, तो वह सारी दुनिया का नाश भी कर सकता है। मनुष्य ने ऐटम बम, हाइड्रोजन बम जैसे अस्त्र तैयार किए। यह सब मनुष्य की तपस्या का ही फल है। इस आसुरी तपस्या से दुनिया का तो नुकसान होता ही है, लेकिन ऐसी तपस्या करनेवाला स्वयं आत्मनाश की तैयारी करता है।"},{"section":"hindi","sectionName":"Hindi","number":2,"hi":"'नीयत' से तात्पर्य हैः","en":"","optionsHi":["इरादा","सोच","अनिश्चय","उपर्युक्त में से एक से अधिक","उपर्युक्त में से कोई नहीं"],"optionsEn":[],"id":32,"explanation":"सही उत्तर A है। “नीयत” का अर्थ व्यक्ति का इरादा या intention होता है।","passage":"पुराणों में देखा गया है कि तप देवता करते हैं और राक्षस भी। जिस किसी को कुछ भी सिद्धि प्राप्त करनी है, तप किए बिना कोई चारा नहीं। इसमें उसकी नीयत अगर सात्विक रही, तो उसका और दुनिया का भला होता है। अगर उसकी नीयत बुरी रही, तो वह सारी दुनिया का नाश भी कर सकता है। मनुष्य ने ऐटम बम, हाइड्रोजन बम जैसे अस्त्र तैयार किए। यह सब मनुष्य की तपस्या का ही फल है। इस आसुरी तपस्या से दुनिया का तो नुकसान होता ही है, लेकिन ऐसी तपस्या करनेवाला स्वयं आत्मनाश की तैयारी करता है।"},{"section":"hindi","sectionName":"Hindi","number":3,"hi":"बाँधा था विधु को किसने, इन काली जंजीरो से। मणिवाले फणियों का मुख क्यों भरा हुआ था हीरों से ।। इस काव्य पंक्तियों में कौन-सा अलंकार है-","en":"","optionsHi":["अनुप्रास","श्लेष","यमक","अतिशयोक्ति"],"optionsEn":[],"id":33,"explanation":"सही उत्तर D है। पंक्तियों में वस्तु/दृश्य का बढ़ा-चढ़ाकर वर्णन किया गया है—जैसे काली जंजीरों से विधु को बाँधना और फणियों के मुख में हीरे भरना—इसलिए अतिशयोक्ति अलंकार है।"},{"section":"hindi","sectionName":"Hindi","number":4,"hi":"किस शब्द का संधि-विच्छेद सही नहीं है?","en":"","optionsHi":["महामात्य = महा + आमात्य","भयाक्रांत = भय + आक्रांत","स्नेहाविष्ट = स्नेह + आविष्ट","कंटकाकीर्ण = कंटक + आकीर्ण"],"optionsEn":[],"id":34,"explanation":"सही उत्तर A है। “महामात्य” का सही संधि-विच्छेद “महा + अमात्य” होता है, जबकि दिए गए विकल्प A में “आमात्य” लिखा है; इसलिए वही गलत है।"},{"section":"hindi","sectionName":"Hindi","number":5,"hi":"निम्नलिखित में कौन-सा तत्सम तद्भव युग्म सही नहीं है?","en":"","optionsHi":["यव-जौ","शकट-छकड़ा","कपर्दिका-कौड़ी","जीर्ण-शीर्ण"],"optionsEn":[],"id":35,"explanation":"सही उत्तर D है। “जीर्ण” का तद्भव “झीर्ण/जीर्ण” की दिशा में आता है; “शीर्ण” उसका मान्य तद्भव युग्म नहीं है। इसलिए जीर्ण-शीर्ण सही तत्सम-तद्भव युग्म नहीं है।"},{"section":"hindi","sectionName":"Hindi","number":6,"hi":"निम्नलिखित में कौन-कौन सी बोलियाँ उत्तर प्रदेश में बोली जाती हैं? I. ब्रज II. अवधी III. कन्नौजी IV. बघेली","en":"","optionsHi":["I, II ,III","II , IV","II , III ,IV","I , II , III , IV"],"optionsEn":[],"id":36,"explanation":"सही उत्तर A है। ब्रज, अवधी और कन्नौजी उत्तर प्रदेश की प्रमुख बोलियों में हैं। बघेली मुख्यतः मध्य प्रदेश के विंध्य क्षेत्र से संबंधित है।"},{"section":"hindi","sectionName":"Hindi","number":7,"hi":"निम्नलिखित में 'यमुना' का पर्यायवाची शब्द नहीं है-","en":"","optionsHi":["अर्कजा","कृष्णा","कूलंकषा","हंससुता"],"optionsEn":[],"id":37,"explanation":"सही उत्तर C है। अर्कजा, कृष्णा और हंससुता यमुना के पर्याय/संबंधित नाम हैं; “कूलंकषा” यमुना का पर्याय नहीं है।"},{"section":"hindi","sectionName":"Hindi","number":8,"hi":"\"हेत प्रीति से जो मिले, तासो मिलिए धाय\" यह उक्ति किस संत कवि की है?","en":"","optionsHi":["रैदास","दादू दयाल","नानकदेव","कबीर"],"optionsEn":[],"id":38,"explanation":"सही उत्तर D है। “हेत प्रीति से जो मिले, तासो मिलिए धाय” कबीर की साखी/वाणी से संबंधित प्रसिद्ध पंक्ति है।"},{"section":"hindi","sectionName":"Hindi","number":9,"hi":"अन्या से अनन्या' आत्मकथा किसकी है?","en":"","optionsHi":["मन्नू भण्डारी","सुषमा वेदी","प्रभा खेतान","उषा प्रियंवदा"],"optionsEn":[],"id":39,"explanation":"सही उत्तर C है। “अन्या से अनन्या” आत्मकथा प्रभा खेतान की रचना है।"},{"section":"hindi","sectionName":"Hindi","number":10,"hi":"\"अधरों में राग अमन्द पिए, अलकों में मलयज बन्द किए। त अब तक सोई है आली, आँखों में भरे विहाग री।।\" पंक्ति में कौन-सा रस है?","en":"","optionsHi":["श्रृंगार","वात्सल्य","करुण","शान्त"],"optionsEn":[],"id":40,"explanation":"सही उत्तर A है। पंक्तियों में प्रिय/नायिका, सौंदर्य, अनुराग और मिलन की भावभूमि है; इसलिए प्रमुख रस श्रृंगार है।"},{"section":"english","sectionName":"English","number":1,"hi":"The director of the school is either deaf or fool, if . . . . . . . .","en":"The director of the school is either deaf or fool, if . . . . . . . .","optionsHi":["neither","both not","not both","nothing"],"optionsEn":["neither","both not","not both","nothing"],"id":41,"explanation":"सही उत्तर A है। “either...or” के साथ दोनों विकल्पों को नकारने के लिए “neither” का प्रयोग किया जाता है; अर्थ होगा कि निर्देशक न तो बहरा है और न मूर्ख।"},{"section":"english","sectionName":"English","number":2,"hi":"They didn't reach an agreement . . . . . . . . their differences.","en":"They didn't reach an agreement . . . . . . . . their differences.","optionsHi":["on account of","due","because","owing"],"optionsEn":["on account of","due","because","owing"],"id":42,"explanation":"सही उत्तर D है। वाक्य में “despite/in spite of” जैसे विरोध-सूचक प्रयोग की आवश्यकता है; दिए गए प्रश्न में मुद्रण/विकल्प-टेक्स्ट अपूर्ण है, इसलिए स्रोत की formatting भी जाँचने योग्य है।"},{"section":"english","sectionName":"English","number":3,"hi":"About a month ago, I . . . . . . . . a brochure about your hotel, but I . . . . . . . . it yet.","en":"About a month ago, I . . . . . . . . a brochure about your hotel, but I . . . . . . . . it yet.","optionsHi":["request/didn't receive","have requested/am not receiving","was requesting/wasn't receiving","requested/haven't received","have been requested/don't receive"],"optionsEn":["request/didn't receive","have requested/am not receiving","was requesting/wasn't receiving","requested/haven't received","have been requested/don't receive"],"id":43,"explanation":"सही उत्तर A दिया गया है। “About a month ago” के कारण past tense चाहिए, जबकि “yet” सामान्यतः present perfect के साथ आता है; इसलिए स्रोत में दिए विकल्पों की जाँच आवश्यक है क्योंकि A में “request” का रूप भी अपूर्ण दिखता है।"},{"section":"english","sectionName":"English","number":4,"hi":"Sania plays . . . . . . . . badminton while her friend Neha plays . . . . . . . . tennis.","en":"Sania plays . . . . . . . . badminton while her friend Neha plays . . . . . . . . tennis.","optionsHi":["no article, no article","a, a","the, the","the, a"],"optionsEn":["no article, no article","a, a","the, the","the, a"],"id":44,"explanation":"सही उत्तर D है। badminton और tennis जैसे खेलों के नाम सामान्य अर्थ में बोले जाने पर इनके पहले article नहीं लगता: “plays badminton”, “plays tennis”."},{"section":"english","sectionName":"English","number":5,"hi":"The house is . . . . . . . . fire! Send . . . . . . . . the Fire Brigade.","en":"The house is . . . . . . . . fire! Send . . . . . . . . the Fire Brigade.","optionsHi":["in, for","on, for","at, for","on, of"],"optionsEn":["in, for","on, for","at, for","on, of"],"id":45,"explanation":"सही उत्तर B है। सही fixed expression “on fire” है और किसी सेवा/व्यक्ति को बुलाने के लिए “send for” प्रयोग होता है: “The house is on fire. Send for the Fire Brigade.”"},{"section":"english","sectionName":"English","number":6,"hi":"Pawan said to me, \"If I hear any news, I'll phone you.\"","en":"Pawan said to me, \"If I hear any news, I'll phone you.\"","optionsHi":["Pawan told me that if he heard any news, he will phone me.","Pawan told me that if he will hear my news, he will phone me.","Pawan told me that if he had heard any news, he would phone me.","Pawan told me that if he heard any news, he would phone me."],"optionsEn":["Pawan told me that if he heard any news, he will phone me.","Pawan told me that if he will hear my news, he will phone me.","Pawan told me that if he had heard any news, he would phone me.","Pawan told me that if he heard any news, he would phone me."],"id":46,"explanation":"सही उत्तर A दिया गया है। Reported speech में “said” → “told me” और first conditional का backshift करते हुए “hear” → “heard” किया जाता है। स्रोत की कुंजी के अनुसार A चुना गया है।"},{"section":"english","sectionName":"English","number":7,"hi":"Alexander expected to conquer the world.","en":"Alexander expected to conquer the world.","optionsHi":["It was expected by Alexander that he should conquer the world.","It was expected by Alexander that he would conquer the world.","It was expected by Alexander that he will conquer the world.","It had been expected by Alexander that he would conquer the world."],"optionsEn":["It was expected by Alexander that he should conquer the world.","It was expected by Alexander that he would conquer the world.","It was expected by Alexander that he will conquer the world.","It had been expected by Alexander that he would conquer the world."],"id":47,"explanation":"सही उत्तर C दिया गया है। यह sentence transformation/indirect-speech आधारित प्रश्न है; स्रोत में विकल्पों का text extraction टूटा हुआ है, इसलिए मूल PDF/प्रश्न-पृष्ठ देखकर exact विकल्प की पुष्टि करना उचित होगा।"},{"section":"english","sectionName":"English","number":8,"hi":"A man who pays too much attention to his clothes and personal appearance","en":"A man who pays too much attention to his clothes and personal appearance","optionsHi":["Snob","Duffer","Dandy","Licentious"],"optionsEn":["Snob","Duffer","Dandy","Licentious"],"id":48,"explanation":"सही उत्तर C दिया गया है। ऐसा व्यक्ति जो कपड़ों और बाहरी appearance पर जरूरत से ज्यादा ध्यान देता है, उसके लिए “dandy” शब्द प्रयुक्त होता है।"},{"section":"english","sectionName":"English","number":9,"hi":"She never visits any zoo because she is strong opponent of the idea of ......","en":"She never visits any zoo because she is strong opponent of the idea of ......","optionsHi":["setting the animals free into forest","feeding the animals while others are watching","watching the animals in their natural abode","going out of the house on a holiday","holding the animals in captivity for our joy"],"optionsEn":["setting the animals free into forest","feeding the animals while others are watching","watching the animals in their natural abode","going out of the house on a holiday","holding the animals in captivity for our joy"],"id":49,"explanation":"सही उत्तर A दिया गया है। “setting the animals free into forest” का अर्थ जानवरों को जंगल में स्वतंत्र छोड़ना है; स्रोत के अनुसार यही उस व्यक्ति के विरोध का विचार है।"},{"section":"english","sectionName":"English","number":10,"hi":"The national unity of a free people\nP : to make it impracticable\nQ : for there to be an arbitrary administration\nR : depends upon a sufficiently even balance of political power\nS : against a revolutionary opposition that is irreconcilably opposed to it\nThe Proper sequence should be:","en":"The national unity of a free people\nP : to make it impracticable\nQ : for there to be an arbitrary administration\nR : depends upon a sufficiently even balance of political power\nS : against a revolutionary opposition that is irreconcilably opposed to it\nThe Proper sequence should be:","optionsHi":["QRPS","QRSP","RPQS","RSPQ"],"optionsEn":["QRPS","QRSP","RPQS","RSPQ"],"id":50,"explanation":"सही उत्तर B दिया गया है। P ation endoplasmic reticulum में शुरू हो सकता है और Golgi apparatus में आगे processing तथा completion होती है।"},{"section":"maths","sectionName":"Maths","number":1,"hi":"π-е है-","en":"This is π:","optionsHi":["एक धनात्मक परिमेय संख्या","एक ऋणात्मक परिमेय संख्या","एक अपरिमेय संख्या","परिमेय और अपरिमेय दोनों"],"optionsEn":["a positive rational number","a negative rational number","an irrational number","both rational and irrational"],"id":69,"explanation":"सही उत्तर C है। π और e दोनों अपरिमेय संख्याएँ हैं, लेकिन π−e को सामान्यतः अपरिमेय माना जाता है; इस प्रश्न के स्तर पर सही विकल्प C है।"},{"section":"maths","sectionName":"Maths","number":2,"hi":"दो अंकों वाली संख्या के दोनों अंकों का योग 7 है। यदि संख्या में 27 जोड़ दिया जाए, तो अंकों का क्रम उलट जाता है। वह संख्या है","en":"The sum of the two digits of a two-digit number is 7. If 27 is added to the number, the order of the digits is reversed. The number is:","optionsHi":["25","43","52","34"],"optionsEn":["25","43","52","34"],"id":70,"explanation":"सही उत्तर A है। संख्या को 10a+b मानें। a+b=7 और उलटी संख्या में 27 का अंतर देने पर 10b+a=10a+b+27 मिलता है। हल करने पर a=2, b=5, अतः संख्या 25 है।"},{"section":"maths","sectionName":"Maths","number":3,"hi":"किसी विद्यालय में 660 विद्यार्थी हैं। इन विद्यार्थियों का दो-तिहाई लड़के हैं। लड़कों की संख्या का तीन-चौथाई और लड़कियों की संख्या का एक चौथाई खिलाड़ी हैं कुल खिलाड़ियों की संख्या है-","en":"A school has 660 students. Two-thirds of these students are boys. Three-fourths of the boys and one-fourth of the girls are players. The total number of players is:","optionsHi":["370","395","385","330"],"optionsEn":["370","395","385","330"],"id":71,"explanation":"सही उत्तर C है। 660 विद्यार्थियों में 2/3 लड़के = 440 और लड़कियाँ = 220। लड़कों के 3/4 खिलाड़ी = 330 तथा लड़कियों के 1/4 खिलाड़ी = 55। अतः कुल खिलाड़ी = 330 + 55 = 385। इसलिए C सही है।\n\nEnglish: The correct answer is C. Boys = 660 × 2/3 = 440 and girls = 220. Players among boys = 440 × 3/4 = 330, and players among girls = 220 × 1/4 = 55. Total players = 330 + 55 = 385. Therefore, C is correct."},{"section":"maths","sectionName":"Maths","number":4,"hi":"(0.00032)0.4 =?? मान होगा-","en":"(0.00032)^0.4 = ? The value is:","optionsHi":["0.08","0.8","0.008","0.0008"],"optionsEn":["0.08","0.8","0.008","0.0008"],"id":72,"explanation":"सही उत्तर C है। 0.00032 = 32×10⁻⁵; इसका 0.4 घात लेने पर मान 0.008 आता है। अतः C सही है।","hiHtml":"(0.00032)<sup>0.4</sup> = ?? मान होगा-","enHtml":"(0.00032)<sup>0.4</sup> = ??"},{"section":"maths","sectionName":"Maths","number":5,"hi":"15000 मूलधन पर 2 वर्ष के चक्रवृद्धि ब्याज और सामान्य ब्याज का अन्तर 96 है। वार्षिक ब्याज दर क्या होगी?","en":"The difference between compound interest and simple interest on a principal of 15000 for 2 years is 96. What is the annual rate of interest?","optionsHi":["10","12","8","14"],"optionsEn":["10","12","8","14"],"id":73,"explanation":"सही उत्तर C है। दो वर्षों के लिए CI−SI = P(r/100)²। 96 = 15000(r/100)², इसलिए r²=64 और r=8%।"},{"section":"maths","sectionName":"Maths","number":6,"hi":"कोई धन 15 वर्ष 6 माह में तिगुना हो जाता है, तो कितने समय में यह दुगुना होगा ?","en":"A sum of money becomes three times in 15 years 6 months. In how much time will it become twice?","optionsHi":["6 वर्ष, 9 माह","7 वर्ष, 9 माह","8 वर्ष, 3 माह","9 वर्ष, 8 माह"],"optionsEn":["6 years 9 months","7 years 9 months","8 years 3 months","9 years 8 months"],"id":74,"explanation":"सही उत्तर B है। साधारण ब्याज में समय के साथ ब्याज समान दर से बढ़ता है। 15 वर्ष 6 माह में राशि 3 गुना होने का अर्थ ब्याज 2 गुना है; राशि 2 गुना होने के लिए ब्याज 1 गुना चाहिए, अतः समय आधा = 7 वर्ष 9 माह।"},{"section":"maths","sectionName":"Maths","number":7,"hi":"144 पेन बेचने पर राम को 6 पेनों के विक्रय मूल्य के बराबर हानि होती है। हानि प्रतिशत क्या है?","en":"On selling 144 pens, Ram incurs a loss equal to the selling price of 6 pens. What is the loss percentage?","optionsHi":["2","6","14","4"],"optionsEn":["2","6","14","4"],"id":75,"explanation":"सही उत्तर D है। 144 पेन का विक्रय मूल्य = 150 पेन के क्रय मूल्य के बराबर है, क्योंकि 6 पेन के विक्रय मूल्य जितनी हानि हुई। इसलिए 144 CP = 150 SP; हानि प्रतिशत = (6/150)×100 = 4%।"},{"section":"maths","sectionName":"Maths","number":8,"hi":"100 सन्तरे ₹ 400 में खरीदे गए तथा ₹ 60 प्रति दर्जन की दर से बेच दिए गए। प्रतिशत लाभ है","en":"100 oranges are bought for ₹400 and sold at ₹60 per dozen. What is the percentage profit?","optionsHi":["15","20","25","30"],"optionsEn":["15","20","25","30"],"id":76,"explanation":"सही उत्तर C है। 100 संतरे का क्रय मूल्य ₹400 है। ₹60 प्रति दर्जन की दर से 100 संतरे का विक्रय मूल्य = 60 × 100/12 = ₹500। लाभ = ₹500 − ₹400 = ₹100। लाभ प्रतिशत = (100/400) × 100 = 25%। इसलिए C सही है।\n\nEnglish: The correct answer is C. The cost price of 100 oranges is ₹400. At ₹60 per dozen, the selling price of 100 oranges = 60 × 100/12 = ₹500. Profit = ₹500 − ₹400 = ₹100. Profit percentage = (100/400) × 100 = 25%. Therefore, C is correct."},{"section":"maths","sectionName":"Maths","number":9,"hi":"₹5 के 6 की दर से केले खरीद कर ₹6 के 5 की दर से बेचने पर कितने प्रतिशत लाभ होगा?","en":"Bananas are bought at the rate of 6 for ₹5 and sold at the rate of 5 for ₹6. What is the percentage profit?","optionsHi":["36%","42%","44%","48%"],"optionsEn":["36%","42%","44%","48%"],"id":77,"explanation":"सही उत्तर C है। 6 केले का CP ₹5 है, इसलिए 1 केले का CP = 5/6 रुपये। 5 केले का SP ₹6, इसलिए SP प्रति केला = 6/5 रुपये। लाभ प्रतिशत = [(6/5−5/6)/(5/6)]×100 = 44%।"},{"section":"maths","sectionName":"Maths","number":10,"hi":"0.4 का 5% है","en":"5% of 0.4 is:","optionsHi":["0.08","0.8","0.02","0.2"],"optionsEn":["0.08","0.8","0.02","0.2"],"id":78,"explanation":"सही उत्तर C है। 0.4 का 5% = 0.4×5/100 = 0.02।"},{"section":"maths","sectionName":"Maths","number":11,"hi":"एक कस्बे के 1000 निवासियों में से 60% पुरूष है जिनमें से 20% साक्षर हैं। यदि कुल 25% निवासी साक्षर हों, तो कस्बे की कितनी प्रतिशत महिलाएँ साक्षर हैं?","en":"Out of 1000 residents of a town, 60% are men, of whom 20% are literate. If 25% of the total residents are literate, what percentage of the women are literate?","optionsHi":["30","37.5","35","32.5"],"optionsEn":["30","37.5","35","32.5"],"id":79,"explanation":"सही उत्तर D है। 1000 में 600 पुरुष और 400 महिलाएँ हैं। 20% पुरुष साक्षर = 120। कुल साक्षर 25% = 250, इसलिए महिला साक्षर = 130। 130/400×100 = 32.5%।"},{"section":"maths","sectionName":"Maths","number":12,"hi":"भाग के एक प्रश्न में, भाजक भागफल का 10 गुना है एवं शेषफल का 5 गुना है। यदि शेषफल 46 है, तो भाज्य होगा-","en":"In a division problem, the divisor is 10 times the quotient and 5 times the remainder. If the remainder is 46, the dividend is:","optionsHi":["5636","5566","5436","5336"],"optionsEn":["5636","5566","5436","5336"],"id":80,"explanation":"सही उत्तर D दिया गया है। शेषफल 46 है, इसलिए भाजक = 5×46=230। भाजक भागफल का 10 गुना है, इसलिए भागफल=23। भाज्य = 230×23+46 = 5336।"},{"section":"maths","sectionName":"Maths","number":13,"hi":"हारुन एक फल की दुकान पर गया। उसने डेढ़ दर्जन केले ₹2.50 प्रति केला की दर से, साढ़े तीन किलो सेब ₹57.60 प्रति किलो की दर से, डेढ़ किलो आम ₹75.40 -प्रति किलो की दर से और 750 ग्राम अंगूर ₹120 प्रति किलो की दर से खरीदे। यदि उसने फलविक्रेता को ₹500 का एक नोट दिया हो, तो उसे विक्रेता से वापस मिलेंगे-","en":"Harun bought one and a half dozen bananas at ₹2.50 per banana, three and a half kg apples at ₹57.60 per kg, one and a half kg mangoes at ₹75.40 per kg and 750 g grapes at ₹120 per kg. If he gave the fruit seller a ₹500 note, how much would he receive back?","optionsHi":["24.85","14.95","₹50.30","28.10"],"optionsEn":["24.85","14.95","₹50.30","28.10"],"id":81,"explanation":"सही उत्तर C है। 18 केले = ₹45; 3.5 kg सेब = ₹201.60; 1.5 kg आम = ₹113.10; 0.75 kg अंगूर = ₹90। कुल ₹449.70, इसलिए ₹500 में से ₹50.30 वापस मिलेंगे।"},{"section":"maths","sectionName":"Maths","number":14,"hi":"छात्रों के एक समूह में 70% छात्र अंग्रेजी और 65% छात्र हिंदी बोल सकते हैं। यदि 27% छात्र दोनों में से कोई भी भाषा नहीं बोल सकते हैं, तो कितने प्रतिशत छात्र दोनों भाषाएँ बोल सकते हैं?","en":"In a group of students, 70% can speak English and 65% can speak Hindi. If 27% cannot speak either language, what percentage can speak both languages?","optionsHi":["38%","62%","28%","23%"],"optionsEn":["38%","62%","28%","23%"],"id":82,"explanation":"सही उत्तर B दिया गया है, लेकिन समावेशन-बहिष्करण से जाँच करें: कम-से-कम एक भाषा बोलने वाले = 100−27=73%; दोनों = 70+65−73=62%। अतः B सही है।"},{"section":"maths","sectionName":"Maths","number":15,"hi":"8सेमी. त्रिज्या वाले वृत के अन्दर बने वर्ग का क्षेत्रफल ज्ञात कीजिए-","en":"Find the area of a square inscribed in a circle of radius 8 cm:","optionsHi":["256 वर्ग सेमी.","250 वर्ग सेमी.","128 वर्ग सेमी.","125 वर्ग सेमी."],"optionsEn":["256 sq. cm","250 sq. cm","128 sq. cm","125 sq. cm"],"id":83,"explanation":"सही उत्तर C है। वृत्त की त्रिज्या 8 cm है, इसलिए व्यास 16 cm वर्ग का विकर्ण होगा। वर्ग का क्षेत्रफल = d²/2 = 16²/2 = 128 cm²।"},{"section":"maths","sectionName":"Maths","number":16,"hi":"कोई खेल का मैदान आयताकार है। मैदान पर 25 पैसे प्रति वर्ग मीटर के भाव से Rs.1,000 खर्च किए गए। मैदान की चौड़ाई 50m है। यदि मैदान की लम्बाई 20m बढ़ाई गई, तब नया खर्च ज्ञात कीजिए-","en":"A playground is rectangular. ₹1,000 was spent on it at 25 paise per square metre. Its width is 50 m. If its length is increased by 20 m, find the new cost:","optionsHi":["1,250 रुपये","1,000 रुपये","1,500 रुपये","2,250 रुपये"],"optionsEn":["₹1,250","₹1,000","₹1,500","₹2,250"],"id":84,"explanation":"सही उत्तर A है। पुराने खर्च ₹1000 और दर ₹0.25 प्रति वर्ग मीटर है, इसलिए पुराने मैदान का क्षेत्रफल = 1000 ÷ 0.25 = 4000 वर्ग मीटर। चौड़ाई 50 मीटर होने से लंबाई = 4000 ÷ 50 = 80 मीटर। लंबाई 20 मीटर बढ़ने पर नई लंबाई 100 मीटर होगी और नया क्षेत्रफल = 50 × 100 = 5000 वर्ग मीटर। नया खर्च = 5000 × ₹0.25 = ₹1250।"},{"section":"evs","sectionName":"EVS / GS","number":1,"hi":"1.एक्सॉन वाल्डेज़ दुर्घटना का कारण क्या था?","en":"What is the cause of the Exxon Valdez?","optionsHi":["1989 में अलास्का के तट पर डूबे तेल टैंकर से समुद्री जीवन गंभीर रूप से प्रभावित हुआ था।","एक विमान दुर्घटना जिसमें जान-माल का नुकसान हुआ","भारत के तट पर दुर्घटनाग्रस्त हुआ एक जहाज","इनमें से कोई नहीं।"],"optionsEn":["Oil Tanker which sank in 1989 along the coast of Alaska and marine life seriously affected.","a plane which crashed and caused death of human life","a ship which wrecked on the coast of India","none of these."],"id":85,"explanation":"सही उत्तर A है। Exxon Valdez दुर्घटना 1989 में Alaska के तट के पास तेल टैंकर से बड़े oil spill के रूप में हुई, जिससे समुद्री और तटीय पारिस्थितिकी को गंभीर नुकसान हुआ।"},{"section":"evs","sectionName":"EVS / GS","number":2,"hi":"2.शांत हवा में हवा का तापमान -10 डिग्री सेल्सियस होता है। यदि हवा की गति बढ़कर 30 समुद्री मील हो जाए (हवा के तापमान में कोई परिवर्तन न हो), तो थर्मामीटर क्या दर्शाएगा?","en":"In calm air the air temperature is -10° C, if the wind speed should increase to 30 knots (with no change in air temperature) the thermometer would indicate:","optionsHi":["-10 डिग्री सेल्सियस से कहीं अधिक तापमान","-10 डिग्री सेल्सियस से काफी कम तापमान","-10 डिग्री सेल्सियस का तापमान","-30 डिग्री सेल्सियस का तापमान"],"optionsEn":["A much higher temperature than -10° C","A much lower temperature than -10° C","A temperature of -10° C","A temperature of -30° C"],"id":86,"explanation":"सही उत्तर C है। हवा की गति बढ़ने से wind-chill का अनुभव बदलता है, लेकिन वास्तविक वायु तापमान नहीं बदलता। इसलिए स्थिर thermometer -10°C ही दिखाएगा।"},{"section":"evs","sectionName":"EVS / GS","number":3,"hi":"3.वन्यजीवों की संख्या में कमी का मुख्य कारण क्या है?","en":"What is the major cause of diminishing wildlife number?","optionsHi":["पेड़ों की कटाई","नरमांस-भक्षण","निवास का विनाश","पीने के पानी की कमी"],"optionsEn":["Felling of trees","Cannibalism","Habitat destruction","Paucity of drinking water"],"id":87,"explanation":"सही उत्तर C है। वन्यजीवों की संख्या घटने का सबसे व्यापक कारण habitat destruction है; जंगलों का कटना, भूमि परिवर्तन और मानवीय गतिविधियाँ आवास कम करती हैं।"},{"section":"evs","sectionName":"EVS / GS","number":4,"hi":"4.इसका उपयोग ईंधन खपत के सूचकांक के रूप में किया जाता है:","en":"This is used as an index for fuel consumption:","optionsHi":["डिग्री-दिनों में वृद्धि","उपभोक्ता मूल्य सूचकांक","हीटिंग डिग्री-दिन","औसत वार्षिक तापमान"],"optionsEn":["Growing degree-days","Consumer price index","Heating degree-days","Mean annual temperature"],"id":88,"explanation":"सही उत्तर C है। Heating Degree Days (HDD) का उपयोग भवनों में heating demand और ईंधन/ऊर्जा खपत का अनुमान लगाने के लिए किया जाता है।"},{"section":"evs","sectionName":"EVS / GS","number":5,"hi":"निम्नलिखित में से किस पर्यावरणीय प्रदूषक में जैव आवर्धन की समस्या होती है?","en":"Which one of the following environmental pollutants has the problem of biomagnification?","optionsHi":["SO²","NO³","Hg fungicides","O³ and CO²"],"optionsEn":["SO²","NO³","Hg fungicides","O³ and CO²"],"id":89,"explanation":"सही उत्तर C है। Mercury जैसे भारी धातु और कुछ persistent compounds खाद्य श्रृंखला में जैव आवर्धन (biomagnification) दिखा सकते हैं, जिससे ऊँचे trophic levels पर उनकी सांद्रता बढ़ती है।"},{"section":"evs","sectionName":"EVS / GS","number":6,"hi":"6.दक्षिणी कैलिफोर्निया के तटीय क्षेत्रों की तुलना में खाड़ी तट के राज्यों में गर्मियों में अधिक आर्द्रता होती है, जिसका मुख्य कारण यह है:","en":"The Gulf Coast states are more humid in summer than the coastal areas of Southern California mainly because of the:","optionsHi":["खाड़ी देशों में वायु तापमान में वृद्धि","दक्षिणी कैलिफोर्निया में वायु तापमान में गिरावट","मेक्सिको की खाड़ी में पानी का तापमान अधिक है","प्रशांत महासागर के ऊपर हवा की सापेक्ष आर्द्रता कम है।"],"optionsEn":["Higher air temperature in the Gulf States","Lower air temperature in Southern California","Higher water temperature in the Gulf of Mexico","Low relative humidity of the air over the Pacific Ocean"],"id":90,"explanation":"सही उत्तर C है। Gulf Coast के पास गर्म Gulf of Mexico का जल अधिक वाष्पीकरण करता है, जिससे हवा में जलवाष्प बढ़ती है और गर्मियों में आर्द्रता अधिक रहती है।"},{"section":"evs","sectionName":"EVS / GS","number":7,"hi":"घंटी के आकार का बहुभुजीय पिरामिड इंगित करता है","en":"Bell-shaped polygonal pyramid indicates","optionsHi":["युवा व्यक्तियों का कम प्रतिशत","युवा व्यक्तियों का मध्यम प्रतिशत","युवा व्यक्तियों का उच्च प्रतिशत","वृद्ध व्यक्तियों का कम प्रतिशत"],"optionsEn":["low percentage of young individuals","moderate percentage of young individuals","high percentage of young individuals","low percentage of old individuals"],"id":91,"explanation":"सही उत्तर A है। घंटी के आकार की age pyramid सामान्यतः घटती/कम होती युवा आबादी का संकेत देती है; युवा वर्ग का प्रतिशत अपेक्षाकृत कम होता है।"},{"section":"evs","sectionName":"EVS / GS","number":8,"hi":"ज्वालामुखी से उत्सर्जित होने वाली सबसे प्रचुर मात्रा में पाई जाने वाली गैस है:","en":"The most abundant gas emitted from volcanoes is:","optionsHi":["नाइट्रोजन / Nitrogen","सल्फर डाइऑक्साइड / Sulfur dioxide","हीलियम / Helium","कार्बन डाईऑक्साइड / Carbon dioxide","जल वाष्प / Water vapour"],"optionsEn":["Nitrogen","Sulfur dioxide","Helium","Carbon dioxide","Water vapour"],"id":92,"explanation":"सही उत्तर E है। ज्वालामुखीय गैसों में जलवाष्प सामान्यतः सबसे अधिक मात्रा में होती है; इसके बाद CO₂ और अन्य गैसें हो सकती हैं।"},{"section":"teaching","sectionName":"शिक्षण कौशल","number":1,"hi":"एन.सी.ई.आर.टी. (NCERT) के अनुसार सूक्ष्म शिक्षण (Micro-teaching) चक्र की कुल सामान्य समयावधि कितनी होती है?","en":"According to NCERT, what is the total normal duration of the micro-teaching cycle?","optionsHi":["30 मिनट","45 मिनट","36 मिनट","60 मिनट"],"optionsEn":["30 minutes","45 minutes","36 minutes","60 minutes"],"id":93,"explanation":"सही उत्तर C है। सूक्ष्म शिक्षण के सामान्य चक्र में योजना, शिक्षण, feedback, पुनःयोजना, पुनःशिक्षण और पुनःfeedback शामिल होते हैं; इस प्रश्न में कुल सामान्य समय 36 मिनट दिया गया है।"},{"section":"teaching","sectionName":"शिक्षण कौशल","number":2,"hi":"कक्षा में छात्रों का ध्यान आकर्षित करने और बनाए रखने के लिए शिक्षक द्वारा अपने हाव-भाव, शरीर की स्थिति (Body posture) और आवाज के उतार-चढ़ाव (Voice modulation) में परिवर्तन करना किस कौशल के अंतर्गत आता है?","en":"Changing gestures, body posture and voice modulation by a teacher to attract and maintain students' attention comes under which skill?","optionsHi":["पुनर्बलन कौशल","उद्दीपन परिवर्तन कौशल","श्यामपट्ट कौशल","पाठ प्रस्तावना कौशल"],"optionsEn":["Reinforcement skill","Stimulus variation skill","Blackboard skill","Set induction skill"],"id":94,"explanation":"सही उत्तर B है। हाव-भाव, body posture और voice modulation में परिवर्तन करके विद्यार्थियों का ध्यान बनाए रखना “उद्दीपन परिवर्तन कौशल” (stimulus variation skill) है।"},{"section":"teaching","sectionName":"शिक्षण कौशल","number":3,"hi":"एक छात्र द्वारा सही उत्तर दिए जाने पर शिक्षक का मुस्कुराते हुए \"शाबाश! बहुत अच्छा\" कहना किस प्रकार के पुनर्बलन का उदाहरण है?","en":"When a teacher smiles and says 'Well done! Very good' after a student gives the correct answer, what type of reinforcement is this?","optionsHi":["सकारात्मक अ-मौखिक पुनर्बलन","नकारात्मक मौखिक पुनर्बलन","नकारात्मक अ-मौखिक पुनर्बलन","सकारात्मक मौखिक पुनर्बलन"],"optionsEn":["Positive non-verbal reinforcement","Negative verbal reinforcement","Negative non-verbal reinforcement","Positive verbal reinforcement"],"id":95,"explanation":"सही उत्तर D है। “शाबाश! बहुत अच्छा” शब्दों द्वारा दिया गया प्रशंसा-संदेश है, इसलिए यह positive verbal reinforcement है।"},{"section":"teaching","sectionName":"शिक्षण कौशल","number":4,"hi":"सूक्ष्म शिक्षण (Micro-teaching) की तकनीक का विकास सबसे पहले सन 1963 में किस विश्वविद्यालय में किया गया था?","en":"At which university was the micro-teaching technique first developed in 1963?","optionsHi":["हार्वर्ड विश्वविद्यालय","ऑक्सफोर्ड विश्वविद्यालय","कोलंबिया विश्वविद्यालय","स्टैनफोर्ड विश्वविद्यालय"],"optionsEn":["Harvard University","Oxford University","Columbia University","Stanford University"],"id":96,"explanation":"सही उत्तर D है। Micro-teaching का प्रारंभिक व्यवस्थित विकास 1963 में Stanford University से जुड़ा माना जाता है।"},{"section":"teaching","sectionName":"शिक्षण कौशल","number":5,"hi":"विद्यार्थी के अपर्याप्त या अस्पष्ट उत्तर के बाद शिक्षक द्वारा उसे संकेत देने, पुनर्निर्देशित करने या उत्तर की गहराई तक पहुँचने के लिए लगातार प्रश्न पूछने की प्रक्रिया को क्या कहा जाता है?","en":"What is the process called in which, after an inadequate or unclear answer, the teacher gives clues, redirects the student or keeps asking questions to reach the depth of the answer?","optionsHi":["खोजपूर्ण प्रश्न कौशल","दृष्टांत कौशल","व्याख्या कौशल","श्यामपट्ट लेखन कौशल"],"optionsEn":["Probing question skill","Illustration skill","Explanation skill","Blackboard writing skill"],"id":97,"explanation":"सही उत्तर A है। विद्यार्थी के अधूरे उत्तर को संकेत, probing और लगातार प्रश्नों द्वारा स्पष्ट/गहरा करना probing या खोजपूर्ण प्रश्न कौशल का उद्देश्य है।"},{"section":"teaching","sectionName":"शिक्षण कौशल","number":6,"hi":"भारत में सूक्ष्म शिक्षण (Micro Teaching) के प्रथम प्रयोगकर्ता या शुरुआत का श्रेय किसे दिया जाता है?","en":"Who is credited with the first use or beginning of micro-teaching in India?","optionsHi":["बी. के. पासी","एन. एल. गेज","डी. डी. तिवारी","बी. एफ. स्किनर"],"optionsEn":["K. Passi","N. L. Gage","D. Tiwari","F. Skinner"],"id":98,"explanation":"सही उत्तर A है। भारत में micro-teaching के प्रारंभिक प्रयोग और प्रशिक्षण के प्रसार से बी. के. पासी का नाम प्रमुख रूप से जुड़ा है।"},{"section":"teaching","sectionName":"शिक्षण कौशल","number":7,"hi":"प्रस्तावना कौशल (Skill of Introduction / Set Induction) का मुख्य आधार क्या होता है?","en":"What is the main basis of the Skill of Introduction / Set Induction?","optionsHi":["शिक्षक का व्यक्तिगत दृष्टिकोण","छात्र का पूर्व ज्ञान","कक्षा का भौतिक वातावरण","पाठ्यपुस्तक के अध्यायों की कुल संख्या"],"optionsEn":["Teacher's personal viewpoint","Student's prior knowledge","Physical environment of the classroom","Total number of textbook chapters"],"id":99,"explanation":"सही उत्तर B है। Set induction का उद्देश्य नए पाठ को विद्यार्थी के पहले से मौजूद ज्ञान और अनुभव से जोड़कर सीखने की तैयारी कराना है।"},{"section":"teaching","sectionName":"शिक्षण कौशल","number":8,"hi":"शिक्षण के सूत्रों में 'ज्ञात से अज्ञात की ओर' (From Known to Unknown) का सिद्धांत मुख्य रूप से किस पर आधारित है?","en":"The teaching maxim 'From Known to Unknown' is mainly based on which basis?","optionsHi":["तार्किक आधार पर","प्रशासनिक आधार पर","मनोवैज्ञानिक आधार पर","आर्थिक आधार पर"],"optionsEn":["Logical basis","Administrative basis","Psychological basis","Economic basis"],"id":100,"explanation":"सही उत्तर C है। “ज्ञात से अज्ञात” सिद्धांत सीखने की मनोवैज्ञानिक प्रक्रिया पर आधारित है, क्योंकि विद्यार्थी नई जानकारी को पूर्व ज्ञान से जोड़कर अधिक आसानी से समझता है।"},{"section":"cdp","sectionName":"CDP","number":1,"hi":"1.बच्चे की वृद्धि और विकास का अध्ययन करने का सबसे अच्छा तरीका क्या है?","en":"The best method to study growth and development of the child is:","optionsHi":["मनोविश्लेषणात्मक विधि","तुलनात्मक विधि","विकासात्मक विधि","सांख्यिकीय विधि"],"optionsEn":["Psychoanalytic Method","Comparative Method","Developmental Method","Statistical Method"],"id":101,"explanation":"सही उत्तर C है। विकासात्मक विधि में बच्चे की वृद्धि और विकास को समय के साथ क्रमिक रूप से देखा जाता है, इसलिए बाल-विकास के अध्ययन के लिए यह उपयुक्त है।"},{"section":"cdp","sectionName":"CDP","number":2,"hi":"2.विकास में PSRN शब्द का तात्पर्य है:","en":"Term PSRN in development implies:","optionsHi":["Problem solving, reasoning and numeracy","Problem solving relationship and numeracy","Perceptual skill, reasoning and numeracy","Perceptual skill, relationship and numbers"],"optionsEn":["Problem solving, reasoning and numeracy","Problem solving relationship and numeracy","Perceptual skill, reasoning and numeracy","Perceptual skill, relationship and numbers"],"id":102,"explanation":"सही उत्तर C है। PSRN का अर्थ Perceptual Skill, Reasoning and Numeracy है; यह प्रारंभिक गणितीय/संज्ञानात्मक क्षमताओं के विकास से जुड़ा है।"},{"section":"cdp","sectionName":"CDP","number":3,"hi":"3.“व्यक्ति अपनी गलतियों से सीखता है” यह कथन किस अधिगम सिद्धांत पर आधारित है?","en":"“Individual learns from his own mistakes” This statement is based on which learning theory?","optionsHi":["वाद्य यंत्र संबंधी अनुकूलन","अंतर्दृष्टि","परीक्षण और त्रुटि /Trial & Error","शास्त्रीय कंडीशनिंग"],"optionsEn":["Instrumental conditioning","Insight","परीक्षण और त्रुटि /Trial & Error","Classical conditioning"],"id":103,"explanation":"सही उत्तर C है। “गलतियों से सीखना” Thorndike के Trial and Error learning से जुड़ा है, जिसमें सही प्रतिक्रिया धीरे-धीरे सफल प्रयासों के माध्यम से मजबूत होती है।"},{"section":"cdp","sectionName":"CDP","number":4,"hi":"4.यदि किसी बच्चे की मानसिक आयु 5 वर्ष और वास्तविक आयु 4 वर्ष है, तो उस बच्चे का बुद्धि लब्धि क्या होगा?","en":"If a child has mental age of 5 years and chronological age of 4 years than what will be the IQ of child?","optionsHi":["125","80","120","100"],"optionsEn":["125","80","120","100"],"id":104,"explanation":"सही उत्तर A है। IQ = Mental Age/Chronological Age ×100 = 5/4×100 = 125।"},{"section":"cdp","sectionName":"CDP","number":5,"hi":"5.जॉन ड्यूवी के अनुसार, विद्यालय एक __________ संस्था है, और शिक्षा एक __________ प्रक्रिया है।","en":"According to John Dewey, school is a __________ institution, and education is a __________ process.","optionsHi":["सामाजिक, सामाजिक","सामाजिक, दार्शनिक","दार्शनिक, दार्शनिक","पर्यावरणीय, मनोवैज्ञानिक"],"optionsEn":["सामाजिक, सामाजिक","सामाजिक, दार्शनिक","दार्शनिक, दार्शनिक","पर्यावरणीय, मनोवैज्ञानिक"],"id":105,"explanation":"सही उत्तर A है। John Dewey ने विद्यालय को सामाजिक संस्था और शिक्षा को सामाजिक प्रक्रिया के रूप में देखा; शिक्षा का उद्देश्य व्यक्ति को सामाजिक जीवन के लिए तैयार करना है।"},{"section":"cdp","sectionName":"CDP","number":6,"hi":"6.पूर्व-प्राथमिक स्तर पर लिखते समय जोर से पढ़ने को महत्व दिया जाता है। यह अधिगम के किस सिद्धांत पर आधारित है?","en":"At the pre-primary stage reading aloud while writing is given importance. This is based on which theory of learning?","optionsHi":["परीक्षण और त्रुटि","कंडीशनिंग","अंतर्दृष्टि","अनुकरण"],"optionsEn":["Trial & Error","Conditioning","Insight","Imitation"],"id":106,"explanation":"सही उत्तर B है। जोर से पढ़ना stimulus-response और reinforcement जैसी प्रक्रियाओं के माध्यम से व्यवहार को मजबूत करता है; इसलिए प्रश्न इसे conditioning से जोड़ता है।"},{"section":"cdp","sectionName":"CDP","number":7,"hi":"7.चिंतन प्रक्रियाओं के निर्माण से संबंधित अध्ययन के क्षेत्र को, जिसमें स्मरण, समस्या समाधान और निर्णय लेना शामिल है, कहा जाता है:","en":"The field of study concerned with the construction of thought processes, including remembering, problem solving, and decision-making is called:","optionsHi":["शिक्षाशास्त्र","शिक्षा","ज्ञानमीमांसा","संज्ञानात्मक विकास"],"optionsEn":["Pedagogy","Education","Epistemology","Cognitive Development"],"id":107,"explanation":"सही उत्तर D है। स्मरण, समस्या-समाधान और निर्णय-लेना cognitive processes हैं; इनके विकास और अध्ययन को संज्ञानात्मक विकास से जोड़ा जाता है।"},{"section":"cdp","sectionName":"CDP","number":8,"hi":"8.जीन पियाजे के अनुसार, बच्चे अमूर्त तर्क और तर्क कौशल का विकास निम्न परिस्थितियों के दौरान करते हैं:","en":"According to Jean Piaget, children develop abstract logic and reasoning skill during:","optionsHi":["संवेदी-प्रेरक अवस्था","पूर्व-संचालन अवस्था","औपचारिक परिचालन चरण","ठोस परिचालन चरण"],"optionsEn":["संवेदी-प्रेरक अवस्था","पूर्व-संचालन अवस्था","औपचारिक परिचालन चरण","ठोस परिचालन चरण"],"id":108,"explanation":"सही उत्तर C है। Piaget के formal operational stage में किशोर अमूर्त विचार, hypothetical reasoning और तार्किक तर्क करने की क्षमता विकसित करते हैं।"},{"section":"computer","sectionName":"Computer","number":1,"hi":"1.निम्नलिखित में से कौन सा चुंबकीय डिस्क भंडारण का लाभ नहीं है?","en":"Which of the following is not an advantage of magnetic disk storage?","optionsHi":["चुंबकीय डिस्क का एक्सेस टाइम चुंबकीय टेप की तुलना में काफी कम होता है।","डिस्क स्टोरेज टेप स्टोरेज से सस्ता होता है।","डिस्क स्टोरेज चुंबकीय टेप की तुलना में अधिक समय तक चलता है।","इनमे से कोई भी नहीं"],"optionsEn":["The access time of magnetic disk is much less than that of magnetic tape","Disk storage is less expensive than tape storage","Disk storage is longer lasting than magnetic tape","None of the above"],"id":109,"explanation":"सही उत्तर B है। Magnetic disk की तुलना में disk storage को हमेशा tape storage से सस्ता कहना सामान्य लाभ नहीं है; disks तेज random access देते हैं, जबकि tape अक्सर कम लागत वाले sequential storage के लिए उपयोग होता है।"},{"section":"computer","sectionName":"Computer","number":2,"hi":"2.वर्चुअल मेमोरी के संबंध में निम्नलिखित सभी कथन सत्य हैं, सिवाय इसके कि...","en":"All of the following are TRUE regarding virtual memory EXCEPT","optionsHi":["वर्चुअल मेमोरी को किसी भी मात्रा में रैम आवंटित की जा सकती है।","वर्चुअल मेमोरी आवंटित करने के लिए हार्ड डिस्क ड्राइव स्पेस की मात्रा की सेटिंग को मैन्युअल रूप से बदला जा सकता है।","इस अस्थायी भंडारण को स्वैप फ़ाइल या पेज फ़ाइल कहा जाता है।","वर्चुअल मेमोरी हार्ड ड्राइव का भौतिक स्थान है।"],"optionsEn":["Any amount of RAM can be allocated to virtual memory","The setting for the amount of hard disk drive space to allocate virtual memory can be manually change","This temporary storage is called the swap file or page file","Virtual memory is the physical space of the hard drive"],"id":110,"explanation":"सही उत्तर A है। Virtual memory को उपलब्ध physical RAM की “किसी भी मात्रा” में मनमाने ढंग से allocate नहीं किया जा सकता; इसकी सीमा hardware और operating-system configuration पर निर्भर करती है।"},{"section":"computer","sectionName":"Computer","number":3,"hi":"3. गटर मार्जिन क्या है?","en":"What is gutter margin?","optionsHi":["प्रिंटिंग के समय बाएँ मार्जिन में जोड़ा जाने वाला मार्जिन","प्रिंटिंग के समय दाएँ मार्जिन में जोड़ा जाने वाला मार्जिन","पृष्ठ की बाइंडिंग साइड में प्रिंटिंग के समय जोड़ा जाने वाला मार्जिन","प्रिंटिंग के समय पेज के बाहरी किनारे पर जोड़ा जाने वाला मार्जिन"],"optionsEn":["Margin that is added to the left margin when printing","Margin that is added to right margin when printing","Margin that is added to the binding side of page when printing","Margin that is added to the outside of the page when printing"],"id":111,"explanation":"सही उत्तर C है। Gutter margin binding के लिए पृष्ठ की binding side पर अतिरिक्त खाली स्थान होता है, ताकि binding के बाद text कटे या छिपे नहीं।"},{"section":"computer","sectionName":"Computer","number":4,"hi":"4.एक्सेस में ऊपर की ओर तीर का निशान या Ctrl+ऊपर की ओर तीर का निशान दबाएँ।","en":"In Access press UP ARROW or CTRL+UP ARROW","optionsHi":["चयनित कंट्रोल को दाईं ओर ले जाएं (लेआउट का हिस्सा होने वाले कंट्रोल को छोड़कर)।","चयनित कंट्रोल को बाईं ओर ले जाएं (लेआउट का हिस्सा होने वाले कंट्रोल को छोड़कर)।","चयनित कंट्रोल को ऊपर की ओर ले जाएं","इनमें से कोई नहीं"],"optionsEn":["Move the selected control to the right (except controls that are part of a layout)","Move the selected control to the left (except controls that are part of a layout)","Move the selected control up","None of these"],"id":112,"explanation":"सही उत्तर C है। Access में Ctrl+Up Arrow चुने गए control को ऊपर की ओर ले जाने का shortcut है; इसलिए C सही है।"},{"section":"life","sectionName":"जीवन कौशल / प्रबंधन","number":1,"hi":"1.अब्रहाम मैस्लो के आवश्यकता पदानुक्रम सिद्धांत (Hierarchy of Needs) के अनुसार सबसे शीर्ष या अंतिम आवश्यकता कौन सी है?","en":"According to Abraham Maslow's hierarchy of needs theory, what is the highest or ultimate need?","optionsHi":["शारीरिक आवश्यकताएं","सुरक्षा आवश्यकताएं","आत्म-सिद्धि (Self-actualization) की आवश्यकता","सम्मान की आवश्यकता"],"optionsEn":["Physiological needs","Safety needs","Need for self-actualization","Esteem needs"],"id":113,"explanation":"सही उत्तर C है। Maslow के hierarchy में physiological, safety, love/belonging और esteem के ऊपर self-actualization को उच्चतम आवश्यकता के रूप में रखा गया है।"},{"section":"life","sectionName":"जीवन कौशल / प्रबंधन","number":2,"hi":"2.विद्यालय में मानवीय मूल्यों (Human Values) के संवर्द्धन के लिए सबसे प्रभावी और प्रत्यक्ष माध्यम क्या है?","en":"What is the most effective and direct medium for the promotion of human values in a school?","optionsHi":["केवल नैतिक शिक्षा की पाठ्यपुस्तकें पढ़ना","शिक्षक का स्वयं का आदर्श एवं नैतिक आचरण","कक्षा में पुरस्कारों की घोषणा करना","परीक्षा में अधिक अंक प्राप्त करना"],"optionsEn":["Reading only moral education textbooks","The teacher's own ideal and ethical conduct","Announcing awards in the class","Scoring higher marks in exams"],"id":114,"explanation":"सही उत्तर B है। बच्चे शिक्षक के व्यवहार को देखकर सीखते हैं; इसलिए शिक्षक का स्वयं का आदर्श, ईमानदार और नैतिक आचरण मानव मूल्यों के विकास का प्रत्यक्ष माध्यम बनता है।"},{"section":"life","sectionName":"जीवन कौशल / प्रबंधन","number":3,"hi":"3.कक्षा कक्ष में प्रभावी प्रबंधन और लोकतांत्रिक वातावरण स्थापित करने के लिए एक शिक्षक को किस प्रकार का नेतृत्व (Leadership) अपनाना चाहिए?","en":"What kind of leadership should a teacher adopt to establish effective management and a democratic environment in the classroom?","optionsHi":["सत्तावादी या निरंकुश नेतृत्व","उदासीन नेतृत्व","सहयोगी एवं प्रजातांत्रिक नेतृत्व","कठोर आज्ञाकारी नेतृत्व"],"optionsEn":["Autocratic or authoritarian leadership","Laissez-faire/indifferent leadership","Collaborative and democratic leadership","Rigid obedient leadership"],"id":115,"explanation":"सही उत्तर C है। लोकतांत्रिक कक्षा में शिक्षक विद्यार्थियों की भागीदारी, संवाद और सहयोग को बढ़ाता है; इसलिए collaborative and democratic leadership उपयुक्त है।"},{"section":"life","sectionName":"जीवन कौशल / प्रबंधन","number":4,"hi":"4.जब एक विद्यार्थी अपनी व्यक्तिगत कठिनाइयों के कारण कक्षा में मानसिक रूप से अनुपस्थित या विचलित रहता है, तो शिक्षक को मार्गदर्शक (Guide) के रूप में क्या करना चाहिए?","en":"When a student remains mentally absent or distracted due to personal difficulties, what should the teacher do as a guide?","optionsHi":["विद्यार्थी को कक्षा से बाहर निकाल देना चाहिए","सहानुभूतिपूर्ण संवाद स्थापित करके उसकी समस्या को समझना और सहयोग करना","उसकी इस स्थिति की अनदेखी करना चाहिए","प्राचार्य से उसकी शिकायत करनी चाहिए"],"optionsEn":["The student should be expelled from the class","Understanding their problem through empathetic communication and cooperating","This situation should be ignored","Complain about him to the principal"],"id":116,"explanation":"सही उत्तर B है। व्यक्तिगत कठिनाई से विचलित विद्यार्थी के साथ सहानुभूतिपूर्ण संवाद करके उसकी समस्या समझना और उचित सहयोग देना शिक्षक की guiding role के अनुरूप है।"},{"section":"life","sectionName":"जीवन कौशल / प्रबंधन","number":5,"id":117,"hi":"WHO के अनुसार Life Skills का सबसे उपयुक्त अर्थ क्या है?","en":"According to WHO, what is the most appropriate meaning of Life Skills?","optionsHi":["अनुकूलनशील और सकारात्मक व्यवहार की वे क्षमताएँ, जो व्यक्ति को दैनिक जीवन की माँगों और चुनौतियों से प्रभावी ढंग से निपटने में सक्षम बनाती हैं।","केवल परीक्षा में अच्छे अंक प्राप्त करने की क्षमता","केवल शारीरिक स्वास्थ्य बनाए रखने की क्षमता","केवल रोजगार प्राप्त करने की क्षमता"],"optionsEn":["Abilities for adaptive and positive behaviour that enable individuals to deal effectively with the demands and challenges of everyday life.","Only the ability to score good marks in examinations","Only the ability to maintain physical health","Only the ability to obtain employment"],"explanation":"WHO के अनुसार Life Skills ऐसी क्षमताएँ हैं जो व्यक्ति को दैनिक जीवन की माँगों और चुनौतियों से अनुकूलनशील एवं सकारात्मक तरीके से निपटने में सहायता करती हैं।","source":"WHO Life Skills Education School Handbook (2020)"},{"section":"life","sectionName":"जीवन कौशल / प्रबंधन","number":6,"id":118,"hi":"WHO के Life Skills framework में निम्नलिखित में से कौन-सा कौशल शामिल है?","en":"Which of the following is included in the WHO Life Skills framework?","optionsHi":["केवल रटकर याद करना","केवल लिखावट सुधारना","निर्णय लेना और समस्या-समाधान","केवल तेज पढ़ना"],"optionsEn":["Only rote memorization","Only improving handwriting","Decision-making and problem-solving","Only reading quickly"],"explanation":"WHO के core life skills में decision-making और problem-solving दोनों शामिल हैं। ये व्यक्ति को दैनिक जीवन की समस्याओं और निर्णयों से प्रभावी ढंग से निपटने में सहायता करते हैं।","source":"WHO Life Skills Education School Handboo   82:['दो भाषाएँ बोलने वालों के प्रतिशत में समावेशन-बहिष्करण सिद्धांत लागू होता है: कम-से-कम एक भाषा बोलने वाले = दोनों का योग − दोनों भाषाएँ बोलने वाले।','Use inclusion–exclusion: people speaking at least one language = English group + Hindi group − both-language group.'],
  83:['वृत्त में अंतर्निहित वर्ग का विकर्ण वृत्त का व्यास होता है। पहले व्यास निकालें, फिर वर्ग का क्षेत्रफल = विकर्ण²/2 लगाएँ।','For a square inscribed in a circle, the square’s diagonal equals the circle’s diameter. Find the diameter first, then use area = diagonal²/2.'],
  84:['आयत के क्षेत्रफल से पुरानी लंबाई निकालें, फिर नई लंबाई और चौड़ाई से नया क्षेत्रफल निकालकर प्रति वर्ग मीटर दर से नया खर्च ज्ञात करें।','Find the original length from the old area, increase it by 20 m, calculate the new area, and multiply by the cost per square metre.'],
  104:['बुद्धिलब्धि का पारंपरिक सूत्र IQ = मानसिक आयु ÷ वास्तविक आयु × 100 है। दिए गए दोनों आयु मानों को इसी अनुपात में रखना होता है।','The traditional IQ formula is mental age ÷ chronological age × 100. Substitute the two ages into this ratio.'],
  113:['Maslow के आवश्यकता पदानुक्रम में मूलभूत शारीरिक आवश्यकताओं से ऊपर सुरक्षा, प्रेम/सम्बन्ध, सम्मान और अंत में आत्म-सिद्धि आती है।','In Maslow’s hierarchy, physiological needs are followed by safety, love/belonging and esteem, with self-actualization at the top.'],
  114:['विद्यालय में मूल्य केवल किताबों से नहीं, बल्कि विद्यार्थियों के सामने दिखने वाले व्यवहार से भी विकसित होते हैं; शिक्षक का modelling इसी कारण प्रभावी है।','Values are learned not only from textbooks but also from behaviour students observe; teacher modelling is therefore a powerful direct influence.'],
  115:['लोकतांत्रिक कक्षा में निर्णय, संवाद और भागीदारी के अवसर दिए जाते हैं। इसलिए सहयोगी नेतृत्व नियंत्रण के बजाय सहभागिता पर आधारित होता है।','A democratic classroom provides opportunities for dialogue, participation and shared responsibility; collaborative leadership therefore focuses on participation rather than control.'],
  116:['Guidance का उद्देश्य विद्यार्थी को दंडित करना नहीं, बल्कि उसकी समस्या समझकर उचित सहायता देना है। सहानुभूतिपूर्ण संवाद trust और support विकसित करता है।','Guidance is meant to understand and support the learner rather than punish them. Empathetic communication builds trust and provides appropriate support.'],
  117:['WHO के life-skills framework में जीवन कौशल रोजमर्रा की माँगों और चुनौतियों से प्रभावी ढंग से निपटने के लिए adaptive और positive behaviour को सक्षम करने वाली क्षमताएँ हैं।','In WHO’s life-skills framework, life skills are abilities that enable adaptive and positive behaviour for dealing effectively with everyday demands and challenges.'],
  118:['WHO की core life skills में self-awareness, empathy, critical thinking, communication, decision-making और coping जैसी क्षमताएँ शामिल हैं; rote memorization इस समूह का हिस्सा नहीं है।','WHO’s core life skills include abilities such as self-awareness, empathy, critical thinking, communication, decision-making and coping; rote memorization is not one of them.'],
  119:['Active listening केवल सुनना नहीं, बल्कि ध्यानपूर्वक सुनना, समझना और उपयुक्त प्रतिक्रिया देना है; इसलिए यह communication और interpersonal skills से जुड़ा है।','Active listening means more than hearing: it involves attentive understanding and an appropriate response, so it belongs to communication and interpersonal skills.'],
  120:['समस्या-समाधान में समस्या को समझना, संभावित विकल्पों की पहचान करना, उनका मूल्यांकन करना और उपयुक्त समाधान चुनना शामिल होता है।','Problem-solving involves understanding the problem, identifying possible alternatives, evaluating them and selecting an appropriate solution.']

ndidate / अभ्यर्थी:</b> ${esc(state.name)} &nbsp; <b>Starting language / प्रारंभिक भाषा:</b> ${esc(state.lang)}</p><div class="stats"><div class="stat">Correct / सही<b>${r.correct}</b></div><div class="stat">Incorrect / गलत<b>${r.wrong}</b></div><div class="stat">Unattempted / अनुत्तरित<b>${r.un}</b></div><div class="stat">Marks / अंक<b>${r.marks}/360</b></div><div class="stat">Percentage / प्रतिशत<b>${r.percent.toFixed(2)}%</b></div><div class="stat">Time Taken / समय लिया<b>${timeText}</b></div></div><div class="actions noPrint"><button class="btn primary" onclick="window.print()">Save Response Sheet as PDF / PDF में सेव करें</button></div><h2>Section-wise Analysis / विषयवार विश्लेषण</h2><table class="table"><tr><th>Section / अनुभाग</th><th>Total</th><th>Correct</th><th>Wrong</th><th>Unattempted</th><th>Marks</th></tr>${rows}</table><h2>Question-wise Response & Explanation / प्रश्नवार उत्तर एवं व्याख्या</h2>${reviews}</section></div>`}
